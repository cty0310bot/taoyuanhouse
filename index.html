<!DOCTYPE html>
<html lang="zh-TW"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>桃園套房地圖 2026-08-99 00:00</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0}
#map{height:100vh}
.lp{font-size:13px;line-height:1.6}
.lp a{color:#1a56db;font-weight:bold}
.legend{background:#ffffffdd;padding:8px 12px;border-radius:6px;font-size:12px;line-height:1.8}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:middle}
</style>
</head><body>
<div id="map"></div>
<script>
var map=L.map('map').setView([24.98,121.26],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  attribution:'&copy; OpenStreetMap contributors',maxZoom:19
}).addTo(map);

var data=[{"lat": 24.98, "lon": 121.26, "color": "#f59e0b", "cond": "✨ 條件A（首次納入）", "name": "首次納入(也在7日內)", "url": "https://sale.591.com.tw/x", "addr": "測試路", "sec": "桃園區", "price": "300萬", "unit": "15萬/坪", "floor": "3F/5F", "area": "15坪", "indoor": "", "age": "10年", "src": "591"}, {"lat": 24.98, "lon": 121.26, "color": "#e02424", "cond": "🆕 條件A（7日內新增）", "name": "非首次但7日內", "url": "https://sale.591.com.tw/y", "addr": "測試路", "sec": "桃園區", "price": "300萬", "unit": "15萬/坪", "floor": "3F/5F", "area": "15坪", "indoor": "", "age": "10年", "src": "591"}, {"lat": 24.98, "lon": 121.26, "color": "#1a56db", "cond": "條件A", "name": "都不是", "url": "https://sale.591.com.tw/z", "addr": "測試路", "sec": "桃園區", "price": "300萬", "unit": "15萬/坪", "floor": "3F/5F", "area": "15坪", "indoor": "", "age": "10年", "src": "591"}];
data.forEach(function(m){
  var c=L.circleMarker([m.lat,m.lon],{
    radius:9,fillColor:m.color,color:'#fff',weight:2,opacity:1,fillOpacity:.88
  });
  var src=m.url.indexOf('housefun')>-1?'好房網':m.url.indexOf('rakuya')>-1?'樂屋網':m.url.indexOf('u-trust')>-1?'有巢氏房屋':m.url.indexOf('sinyi')>-1?'信義房屋':m.url.indexOf('yungching')>-1?'永慶房屋':'591';
  c.bindPopup('<div class="lp"><a href="'+m.url+'" target="_blank">'+m.name+'</a><br>'+
    '<b>'+m.addr+' · '+m.sec+'</b><br>'+
    '總價 '+m.price+'　單價 '+m.unit+'<br>'+
    '樓層 '+m.floor+'　權狀 '+m.area+(m.indoor?'　室內 '+m.indoor:'')+'<br>'+
    '屋齡 '+(m.age||'—')+'　來源 <b>'+src+'</b>　<span style="color:'+m.color+';font-weight:bold">'+m.cond+'</span></div>');
  c.addTo(map);
});

var legend=L.control({position:'bottomright'});
legend.onAdd=function(){
  var d=L.DomUtil.create('div','legend');
  d.innerHTML='<b>桃園套房 2026-08-99 00:00</b><br>共 '+data.length+' 筆<br>'+
    '<span class="dot" style="background:#1a56db"></span>條件A（12-25坪・≤450萬）<br>'+
    '<span class="dot" style="background:#1a7a4a"></span>條件B（單價≤21萬/坪・權狀>10坪・非頂樓/地下室）<br>'+
    '<span class="dot" style="background:#8833cc"></span>條件A＋B<br>'+
    '<span class="dot" style="background:#f59e0b"></span>✨ 首次納入（全新物件，優先於其他顏色）<br>'+
    '<span class="dot" style="background:#e02424"></span>🆕 7日內新增（取代條件顏色）';
  return d;
};
legend.addTo(map);
</script></body></html>
